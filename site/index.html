<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vigil: practice offers archive</title>
</head>
<body>
<h1>Vigil archive</h1>
<p id="summary">Loading…</p>
<ul id="posts"></ul>

<script>
    fetch('archive.json')
        .then((response) => response.json())
        .then((archive) => {
            document.getElementById('summary').textContent =
                `${archive.count} posts, updated ${new Date(archive.generatedAt).toLocaleString('ro-RO')}`;
            const list = document.getElementById('posts');
            for (const post of archive.posts.slice(0, 20)) {
                const item = document.createElement('li');
                const link = document.createElement('a');
                link.href = post.url;
                link.textContent = post.title;
                item.append(link);
                list.append(item);
            }
        })
        .catch(() => {
            document.getElementById('summary').textContent = 'Could not load the archive.';
        });
</script>
</body>
</html>
